# DockRoute's own site, published by DockRoute itself.
#
# The site container carries dockroute.* labels; the DockRoute instance already
# running on this host picks them up and publishes the DNS record / tunnel
# route. Adjust the hostname to your domain.
services:
  dockroute-site:
    image: ghcr.io/dockroute/dockroute-site:latest
    # To build locally instead of pulling from GHCR:
    # build:
    #   context: .
    #   args:
    #     NEXT_PUBLIC_SITE_URL: https://dockroute.example.com
    container_name: dockroute-site
    restart: unless-stopped
    labels:
      dockroute.enabled: "true"
      dockroute.hostname: "dockroute.example.com"
      # publish through an existing Cloudflare Tunnel (cloudflared must share
      # this network to reach the container by service name):
      dockroute.tunnel.service: "http://dockroute-site:3000"
      # -- or, for a plain record instead of a tunnel, remove the line above
      #    and use:
      # dockroute.target: "203.0.113.7"
      # dockroute.cloudflare.proxied: "true"

  # If this host doesn't run DockRoute yet, uncomment:
