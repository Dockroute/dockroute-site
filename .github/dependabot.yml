version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "chore(ci)"

  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    groups:
      # One weekly PR for runtime minor/patch bumps instead of one per package.
      # This also keeps fumadocs-core and fumadocs-mdx in step: fumadocs-mdx
      # pins a minimum fumadocs-core, and bumping it alone breaks `bun install`
      # (postinstall runs fumadocs-mdx). Majors still get their own PRs.
      production-dependencies:
        dependency-type: production
        update-types: ["minor", "patch"]
      dev-dependencies:
        dependency-type: development
    commit-message:
      prefix: "fix(deps)"
      prefix-development: "chore(deps)"

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "fix(deps)"
