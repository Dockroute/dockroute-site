version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "chore(ci)"

  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    groups:
      # fumadocs-mdx pins a minimum fumadocs-core, so bumping one without the
      # other breaks `bun install` (postinstall runs fumadocs-mdx).
      fumadocs:
        patterns: ["fumadocs-*"]
      dev-dependencies:
        dependency-type: development
    commit-message:
      prefix: "fix(deps)"
      prefix-development: "chore(deps)"

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "fix(deps)"
